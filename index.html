 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luke Music</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Menu Lateral -->
        <aside class="sidebar">
            <h2><i class="fa-solid fa-music"></i> Luke Music</h2>
            <ul>
                <li class="active"><i class="fa-solid fa-house"></i> Início</li>
            </ul>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header>
                <h1>Explorar Músicas</h1>
                <!-- Barra de Pesquisa -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="O que você quer ouvir?">
                </div>
            </header>

            <section class="playlist-section">
                <h3>Músicas Disponíveis</h3>
                <div class="grid-songs" id="song-list">
                    <!-- As músicas serão injetadas via JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Barra de Reprodução Inferior -->
    <footer class="player-bar">
        <div class="song-info">
            <span id="current-title">Selecione uma música</span>
            <span id="current-artist" class="artist-sub">-</span>
        </div>
        <div class="player-controls">
            <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-btn"><i class="fa-solid fa-play"></i></button>
            <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <audio id="audio-element"></audio>
    </footer>

    <script src="script.js"></script>
</body>
</html>
