<style>
/* =========================================================
   LUKE MUSIC — design tokens
   Cor base: verde da marca (#47D07B) sobre fundo quase preto
   com esmaltes (duotons) distintos por gênero.
   Tipografia: Space Grotesk (display) + system-ui (corpo)
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
  --bg-base: #0B0E0C;
  --bg-surface: #141814;
  --bg-elevated: #1E241F;
  --line: rgba(255,255,255,0.08);

  --brand: #47D07B;
  --brand-dim: #2B7A4B;

  --text-1: #F3F6F3;
  --text-2: #9BAAA0;
  --text-3: #5C6B61;

  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --nav-h: 60px;
  --mini-h: 64px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg-base);
  color: var(--text-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  overscroll-behavior-y: none;
}

h1, h2, h3 {
  font-family: "Space Grotesk", -apple-system, sans-serif;
  margin: 0;
  letter-spacing: -0.01em;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  color: inherit;
  cursor: pointer;
}

img { -webkit-user-drag: none; user-select: none; }

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  background: var(--bg-base);
}

/* ---------- estrutura das telas ---------- */
.screen {
  display: none;
  padding: calc(var(--safe-top) + 14px) 18px calc(var(--nav-h) + var(--mini-h) + 24px);
  min-height: 100dvh;
  animation: fade-in .18s ease;
}
.screen.active { display: block; }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 10px;
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: block; }
.brand span { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 19px; }

.screen-title { font-size: 26px; font-weight: 700; }

.icon-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 17px;
  color: var(--text-1);
  background: var(--bg-surface);
  flex-shrink: 0;
}
.icon-btn:active { background: var(--bg-elevated); }

.greeting {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 16px;
}

/* ---------- chips de gênero (home) ---------- */
.chip-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 24px;
  scrollbar-width: none;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--bg-surface);
  color: var(--text-2);
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--line);
}
.chip.is-active { background: var(--brand); color: #06210F; border-color: transparent; }

/* ---------- trilhos horizontais ---------- */
.rail { margin-bottom: 28px; }
.rail h2 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.rail-track {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.rail-track::-webkit-scrollbar { display: none; }

/* ---------- grade de gêneros (tiles estilo referência) ---------- */
.tile-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.genre-tile {
  position: relative;
  height: 92px;
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  padding: 12px;
  background: var(--tile-a, #333);
  background-image: linear-gradient(135deg, var(--tile-a, #333), var(--tile-b, #111));
}
.genre-tile .tile-icon {
  position: absolute;
  top: -10px; right: -8px;
  font-size: 58px;
  opacity: 0.28;
  transform: rotate(-12deg);
  color: #fff;
}
.genre-tile span {
  position: relative;
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,.25);
}

/* ---------- busca ---------- */
.search-field {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 4px;
  position: relative;
}
.search-field i { color: var(--text-3); font-size: 15px; }
.search-field input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-1);
  font-size: 16px;
}
.search-field input::placeholder { color: var(--text-3); }

.suggestions {
  position: relative;
  margin-top: 6px;
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: none;
  border: 1px solid var(--line);
}
.suggestions.is-open { display: block; }
.suggestion-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:active { background: var(--bg-elevated); }
.suggestion-item img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
.suggestion-text { min-width: 0; }
.suggestion-text strong { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestion-text span { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.status-text {
  color: var(--text-2);
  font-size: 14px;
  padding: 18px 2px;
  text-align: center;
}
.status-text.is-error { color: #E28080; }

/* ---------- listas de músicas ---------- */
.song-list { display: flex; flex-direction: column; gap: 2px; }
.song-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
}
.song-row:active { background: var(--bg-surface); }
.song-row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--bg-elevated); flex-shrink: 0; }
.song-row-text { flex: 1; min-width: 0; }
.song-row-text strong { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row-text span { display: block; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row .row-heart { color: var(--text-3); font-size: 16px; padding: 8px; flex-shrink: 0; }
.song-row .row-heart.is-fav { color: var(--brand); }
.song-row.is-playing .song-row-text strong { color: var(--brand); }

/* cartões em grade (resultado de gênero / continuar ouvindo) */
.song-card {
  width: 132px;
  flex-shrink: 0;
  cursor: pointer;
}
.song-card img { width: 132px; height: 132px; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg-elevated); }
.song-card h4 { font-size: 14px; font-weight: 600; margin: 8px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-card p { font-size: 12px; color: var(--text-2); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- mini player ---------- */
.mini-player {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
  width: calc(100% - 20px);
  max-width: 460px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  z-index: 40;
  overflow: hidden;
  backdrop-filter: blur(14px);
}
.mini-player img { width: 40px; height: 40px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
.mini-text { flex: 1; min-width: 0; text-align: left; }
.mini-text strong { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-text span { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-controls { display: flex; align-items: center; gap: 16px; font-size: 16px; padding-right: 4px; flex-shrink: 0; }
.mini-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.08); }
.mini-progress-fill { height: 100%; width: 0%; background: var(--brand); }

/* ---------- nav inferior ---------- */
.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 480px;
  margin: 0 auto;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: flex;
  background: rgba(11,14,12,0.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  z-index: 50;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
}
.nav-item i { font-size: 19px; }
.nav-item.is-active { color: var(--brand); }

/* ---------- tela do player ---------- */
.player-screen {
  background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-base) 55%);
  padding-top: calc(var(--safe-top) + 14px);
  padding-bottom: calc(var(--safe-bottom) + 24px);
  display: flex;
  flex-direction: column;
}
.player-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.player-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--text-2); }

.player-art-wrap { display: flex; justify-content: center; margin-bottom: 26px; }
.player-art {
  width: min(78vw, 320px);
  height: min(78vw, 320px);
  border-radius: 18px;
  object-fit: cover;
  box-shadow: 0 20px 50px rgba(0,0,0,.45);
  background: var(--bg-surface);
}

.player-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}
.player-meta-text { min-width: 0; }
.player-meta-text h2 { font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-meta-text p { margin: 4px 0 0; font-size: 14.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#favorite-btn.is-fav { color: var(--brand); }

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,.14);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 13px; height: 13px;
  border: none;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
#progress-bar { accent-color: var(--brand); }

.progress-wrap { margin-bottom: 8px; }
.progress-times {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-2);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}

.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 0 22px;
}
.transport-secondary { font-size: 22px; width: 46px; height: 46px; }
#shuffle-btn, #repeat-btn { font-size: 15px; color: var(--text-2); }
#shuffle-btn.is-active, #repeat-btn.is-active { color: var(--brand); }
.play-btn-big {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--text-1);
  color: #0B0E0C;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.play-btn-big i { margin-left: 2px; }

.volume-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-3);
  margin-top: auto;
}
#volume-bar { accent-color: var(--text-2); }

/* ---------- toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + var(--mini-h) + var(--safe-bottom) + 18px);
  transform: translateX(-50%);
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  color: var(--text-1);
  font-size: 13.5px;
  padding: 10px 16px;
  border-radius: 999px;
  z-index: 80;
  max-width: 88%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

@media (min-width: 481px) {
  body { background: #050605; }
  #app { box-shadow: 0 0 60px rgba(0,0,0,.5); }
}
